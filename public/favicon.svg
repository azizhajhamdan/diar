<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&amp;display=swap');
      .brand-text {
        font-family: 'Reem Kufi', 'Cairo', sans-serif;
        font-weight: 700;
        fill: #f0c674;
      }
    </style>
  </defs>
  
  <!-- خلفية داكنة -->
  <rect width="100" height="100" rx="20" fill="#0a0805"/>
  
  <!-- حدود ذهبية -->
  <rect x="3" y="3" width="94" height="94" rx="17" fill="none" stroke="#f0c674" stroke-width="1.5"/>
  
  <!-- نص ديّار بخط Reem Kufi -->
  <text x="50" y="55" class="brand-text" font-size="34" text-anchor="middle">ديّار</text>
  
  <!-- النقطة على اليسار -->
  <circle cx="20" cy="51" r="3" fill="#d4a73f"/>
</svg>